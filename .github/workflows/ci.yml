# =============================================================================
#  Intégration continue
# =============================================================================
#
#  Tourne sur chaque proposition de modification et sur la branche principale.
#
#  POURQUOI CHAQUE ÉTAPE EXISTE, ET CE QU'ELLE ATTRAPE SEULE
#  --------------------------------------------------------
#  Aucune de ces étapes n'est redondante, et chacune détecte une classe de
#  défaut que les autres laissent passer :
#
#    workflows:check  un flux de travail invalide : YAML mal formé, action non
#                  épinglée, ou script `run:` dont la syntaxe est fausse. Placé
#                  en premier parce qu'il coûte deux secondes et qu'il évite de
#                  découvrir le défaut après vingt minutes de compilation.
#    format:check  deux personnes formatant différemment produisent un diff
#                  illisible, où la modification réelle se perd.
#    lint          un crochet appelé conditionnellement : plantage garanti sur
#                  le téléphone, invisible à la compilation.
#    typecheck     un champ renommé d'un seul côté. C'est le contrôle le plus
#                  rentable du lot.
#    test          la logique de dates, où un décalage d'un jour ne lève
#                  aucune erreur et ne se voit que sur l'appareil.
#    sql:check     une table sans RLS, ou un droit de lecture accordé par
#                  mégarde. Ces fautes ne se voient NULLE PART ailleurs : le
#                  schéma s'applique sans erreur et l'application fonctionne.
#    export        le seul contrôle qui vérifie que les modules se résolvent
#                  réellement dans le paquet. Ni tsc ni ESLint ne le font.
#    base réelle   une colonne ajoutée au code sans migration appliquée, ou une
#                  table renommée dans le schéma. Ni tsc ni les tests ne le
#                  voient : les tests simulent la base. Seul un appel réel le
#                  dit — et c'est le seul contrôle qui demande des secrets.
#
#  Une seule étape demande donc des secrets, celle qui éprouve la base réelle,
#  et elle est écartée des propositions de modification : une proposition venue
#  d'un dépôt dérivé n'y a pas accès, et l'étape échouerait sur une configuration
#  absente plutôt que sur un défaut de code. Les autres n'en demandent aucun :
#  l'application est conçue pour démarrer sans configuration, en affichant un
#  écran qui explique ce qui manque. C'est ce qui permet à un dépôt public de
#  vérifier son code sans clé.
# =============================================================================

name: Intégration continue

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # Une nouvelle poussée sur la même branche annule la vérification précédente,
  # devenue obsolète.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verifier:
    name: Vérifier
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v5

      - name: Installer Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22.22.2'
          cache: npm

      # `npm ci` et non `npm install` : installe exactement l'arbre du
      # verrouillage, et échoue si package.json et package-lock.json ont
      # divergé. C'est précisément la divergence qu'on veut voir en CI.
      - name: Installer les dépendances
        run: npm ci

      # En premier : deux secondes, et il attrape les défauts de flux de travail
      # qui, sinon, ne se verraient qu'après l'installation du SDK Android et
      # vingt minutes de compilation.
      - name: Contrôler les flux de travail
        run: npm run workflows:check

      - name: Vérifier le formatage
        run: npm run format:check

      - name: Analyser le code
        run: npm run lint

      - name: Vérifier les types
        run: npm run typecheck

      - name: Lancer les tests
        run: npm test

      - name: Contrôler le schéma de la base
        run: npm run sql:check

      # Placé avant l'export, parce qu'il coûte deux secondes là où l'export en
      # coûte quarante.
      #
      # POURQUOI IL EST ICI, ET PLUS SEULEMENT AVANT LA COMPILATION
      # ----------------------------------------------------------
      # Il ne tournait jusqu'ici que dans les deux flux de mise à disposition,
      # déclenchés à la main. Une colonne ajoutée au code sans que la migration
      # correspondante soit appliquée ne se voyait donc qu'au moment de produire
      # le binaire : la compilation s'arrêtait en quarante secondes, sur une
      # étape sans rapport avec elle, et le message parlait de colonnes alors
      # qu'on venait de toucher au style. Le pousser sur `main` est le moment où
      # l'écart apparaît — c'est donc là qu'il doit être vu.
      - name: Éprouver la base réelle
        if: github.event_name != 'pull_request'
        run: |
          npm run securite:api
          npm run verifier:requetes
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      # L'export est le seul contrôle qui fait réellement passer le paquet par
      # Metro. Un module natif mal déclaré, ou un import qui ne se résout qu'en
      # développement, échoue ici et nulle part ailleurs.
      - name: Construire le paquet JavaScript
        run: npm run export:android
        env:
          EXPO_NO_TELEMETRY: '1'
